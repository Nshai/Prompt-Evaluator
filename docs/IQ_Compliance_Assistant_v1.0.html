  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

33);padding:24px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:rgb(17,58,214);animation:pulse 1.1s infinite\"><x-import component-from-global-scope=\"IQIcon\" name=\"Glitter\" size=\"24\" hint-size=\"24px,24px\"><\u002Fx-import><\u002Fspan>\n<div>\n<div style=\"font-weight:600;font-size:17.5px;line-height:28px;color:rgb(1,18,34)\">Finalising the compliance check<\u002Fdiv>\n<div style=\"font-weight:400;font-size:14px;line-height:22px;color:rgb(78,90,101)\">{{ submitSubtitle }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ submitSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"{{ s.dotStyle }}\"><\u002Fspan>\n<span style=\"{{ s.textStyle }}\">{{ s.label }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"height:8px;width:100%;border-radius:999px;background:rgb(242,243,244);overflow:hidden\">\n<div style=\"{{ submitBar }}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-radius:8px;background:rgb(250,250,250);box-shadow:inset 0 0 0 1px rgb(230,232,233);padding:32px;display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:704px;border-radius:16px;background:rgb(255,255,255);box-shadow:inset 0 0 0 1px rgb(230,232,233);padding:24px\">\n<div style=\"display:flex;align-items:center;gap:24px;padding-bottom:16px\">\n<div style=\"{{ finalGradeCardStyle }}\">\n<span style=\"font-weight:600;font-size:27.34px;line-height:40px;letter-spacing:-0.25px;color:rgb(1,18,34);white-space:nowrap\">{{ finalGrade }}<\u002Fspan>\n<span style=\"font-weight:400;font-size:14px;line-height:22px;color:rgb(1,18,34);white-space:nowrap\">Final grading<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:0\">\n<div style=\"font-weight:600;font-size:21.88px;line-height:32px;color:rgb(1,18,34)\">Compliance check complete<\u002Fdiv>\n<div style=\"font-weight:400;font-size:14px;line-height:22px;color:rgb(78,90,101);text-wrap:pretty\">The outcome is stored against the advice case. Return to the advice journey to continue.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recordRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n<div style=\"display:grid;grid-template-columns:200px 1fr;gap:16px;padding:12px 0px;border-top:1px solid rgb(230,232,233)\">\n<span style=\"font-weight:400;font-size:11.2px;line-height:18px;color:rgb(78,90,101)\">{{ r.label }}<\u002Fspan>\n<span style=\"font-weight:400;font-size:14px;line-height:22px;color:rgb(1,18,34);text-wrap:pretty\">{{ r.value }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ hasNotes }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:24px;padding-top:24px;border-top:1px solid rgb(230,232,233);display:flex;flex-direction:column;gap:8px\">\n<div>\n<span style=\"font-weight:600;font-size:17.5px;line-height:28px;color:rgb(1,18,34)\">Notes recorded on this check<\u002Fspan>\n<div style=\"font-weight:400;font-size:11.2px;line-height:18px;color:rgb(78,90,101)\">{{ notesSubtitle }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ checkNotes }}\" as=\"n\" hint-placeholder-count=\"2\">\n<div style=\"border-radius:12px;box-shadow:inset 0 0 0 1px rgb(230,232,233);padding:16px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n<span style=\"{{ n.tagStyle }}\">{{ n.tagLabel }}<\u002Fspan>\n<span style=\"font-weight:600;font-size:14px;line-height:22px;color:rgb(1,18,34)\">{{ n.title }}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-weight:400;font-size:11.2px;line-height:18px;color:rgb(78,90,101)\">{{ n.ref }}<\u002Fspan>\n<div style=\"display:flex\">\n<div style=\"width:18px;flex:none;padding:0px 8px;display:flex\"><span style=\"width:2px;flex:1;background:rgb(78,90,101);display:block\"><\u002Fspan><\u002Fdiv>\n<span style=\"flex:1;min-width:0;font-weight:400;font-size:14px;line-height:22px;color:rgb(52,65,78);text-wrap:pretty\">{{ n.note }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display:flex;gap:10px;margin-top:24px\">\n<button sc-camel-on-click=\"{{ saveAndExit }}\" style=\"{{ primaryBtnStyle }}\">Return to advice journey<\u002Fbutton>\n<button sc-camel-on-click=\"{{ backToResults }}\" style=\"{{ secondaryBtn }}\">View findings<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000},&quot;gradeScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Pass / Refer / Fail&quot;,&quot;A / B / C / D&quot;],&quot;default&quot;:&quot;Pass / Refer / Fail&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Firm configuration&quot;}}\">\nconst CATS = ['Missing evidence','Weak justification','Data inconsistency','Data quality','Missing component','Disclosure shortfall','Process risk','Control gap','Compliance concern'];\n\nconst FINDINGS = [\n  {n:1, ref:'CHK-01 · v2.0', title:'Client objectives and needs recorded', cls:'clear', cats:[], conf:92, cov:100,\n   confReason:'Objectives stated plainly and matched across sources.',\n   covItems:[{label:'Fact Find read',s:'ok'},{label:'Needs Analysis read',s:'ok'},{label:'Suitability report read',s:'ok'}],\n   summary:'Three objectives are stated in the report and each maps to a recorded need in the fact find.',\n   regRefs:['COBS 9A.2'],\n   evidence:[{text:'Retirement income from age 62, £34,000 pa net.',source:'Suitability report (p.2)',mark:'ok'},{text:'Matching goal recorded in fact find, dated 4 Mar.',source:'Fact Find (p.1)',mark:'ok'}],\n   adviser:'', adviserDate:''},\n  {n:2, ref:'CHK-02 · v2.0', title:'Know your client information current and complete', cls:'clear', cats:[], conf:88, cov:100,\n   confReason:'Fact find dated within three months of the recommendation.',\n   covItems:[{label:'Fact Find read',s:'ok'},{label:'Client record read',s:'ok'}],\n   summary:'Income, expenditure, assets and dependants are all populated and dated within the advice window.',\n   regRefs:['COBS 9A.2.1'],\n   evidence:[{text:'Fact find completed 4 Mar 2026, report issued 21 Mar 2026.',source:'Fact Find (cover)',mark:'ok'}],\n   adviser:'', adviserDate:''},\n  {n:3, ref:'CHK-03 · v2.1', title:'Risk, capacity for loss and investment strategy match', cls:'concern', cats:['Data inconsistency','Weak justification'], conf:55, cov:60,\n   confReason:'Conflicting evidence across two documents; ambiguous wording in the report.',\n   covItems:[{label:'ATR questionnaire read',s:'ok'},{label:'Fact Find read',s:'ok'},{label:'Research was password protected',s:'bad'},{label:'Needs Analysis not supplied',s:'none'}],\n   summary:'The recommended portfolio is mapped one band above the recorded attitude to risk, and no client-specific rationale for the override is evidenced.',\n   regRefs:['COBS 9A.2','FG21/1'],\n   evidence:[{text:'ATR result 5 of 7, dated 12 Mar 2026.',source:'ATR record',mark:'ok'},{text:'Recommended portfolio mapped at 6 of 7.',source:'Suitability report (p.6)',mark:'warn'},{text:'No override rationale located in the report or file notes.',source:'Advice case notes',mark:'warn'}],\n   adviser:'Client pushed for higher growth after we modelled the shortfall. Discussed at the 14th March meeting.', adviserDate:'Recorded 15th March 2026'},\n  {n:4, ref:'CHK-04 · v2.0', title:'Recommendation rationale is client-specific', cls:'concern', cats:['Weak justification'], conf:78, cov:100,\n   confReason:'Wording closely matches the firm template across three sections.',\n   covItems:[{label:'Suitability report read',s:'ok'},{label:'Firm template library read',s:'ok'}],\n   summary:'Two of the three recommendation paragraphs are template text with no reference to this client\\u2019s circumstances.',\n   regRefs:['COBS 9A.3'],\n   evidence:[{text:'Paragraphs 4.2 and 4.4 are identical to the firm template.',source:'Suitability report (p.7)',mark:'warn'}],\n   adviser:'Standard wording for this product, the personalisation is in section 5.', adviserDate:'Recorded 21st March 2026'},\n  {n:5, ref:'CHK-05 · v2.1', title:'Capacity for loss evidenced separately', cls:'concern', cats:['Missing evidence','Data inconsistency'], conf:48, cov:40,\n   confReason:'Two documents state different positions and one source is unreadable.',\n   covItems:[{label:'ATR questionnaire read',s:'ok'},{label:'Research was password protected',s:'bad'},{label:'Needs Analysis not supplied',s:'none'}],\n   summary:'Capacity for loss appears to be inferred from the attitude-to-risk score rather than assessed in its own right.',\n   regRefs:['COBS 9A.2','FG21/1'],\n   evidence:[{text:'Fact find p.4 records capacity for loss as low.',source:'Fact Find (p.4)',mark:'warn'},{text:'Suitability report p.6 describes it as medium.',source:'Suitability report (p.6)',mark:'warn'},{text:'No separate capacity assessment located.',source:'Searched categories D and F',mark:'bad'}],\n   adviser:'', adviserDate:''},\n  {n:6, ref:'CHK-06 · v2.0', title:'Evidence trail complete for the advice given', cls:'clear', cats:[], conf:81, cov:85,\n   confReason:'All cited documents were located and read.',\n   covItems:[{label:'11 of 11 cited sources resolved',s:'ok'}],\n   summary:'Every material claim in the report traces to a document in the case.',\n   regRefs:['COBS 9A.3.2'],\n   evidence:[{text:'11 of 11 cited sources resolved.',source:'Evidence index',mark:'ok'}],\n   adviser:'', adviserDate:''},\n  {n:7, ref:'CHK-07 · v2.1', title:'Charges, costs and value assessed', cls:'concern', cats:['Disclosure shortfall'], conf:84, cov:100,\n   confReason:'Figures are explicit and comparable.',\n   covItems:[{label:'Illustration read',s:'ok'},{label:'Existing plan schedule read',s:'ok'}],\n   summary:'Ongoing charges rise from 0.94% to 1.31% and the report does not set out what the client receives for the difference.',\n   regRefs:['COBS 6.1A','PRIN 2A'],\n   evidence:[{text:'Existing plan OCF 0.94%, recommended 1.31%.',source:'Illustration (p.3)',mark:'warn'},{text:'No value statement located against the increase.',source:'Suitability report (p.9)',mark:'warn'}],\n   adviser:'', adviserDate:''},\n  {n:8, ref:'CHK-08 · v2.1', title:'Client understanding demonstrated, not assumed', cls:'concern', cats:['Missing evidence','Process risk'], conf:71, cov:75,\n   confReason:'Interaction evidence is thin but the meeting note is legible.',\n   covItems:[{label:'File note read',s:'ok'},{label:'Signed declaration read',s:'ok'},{label:'No meeting recording supplied',s:'none'}],\n   summary:'The report relies on a signed declaration. There is limited evidence of questions asked, explanations given, or understanding confirmed.',\n   regRefs:['COBS 9A.3','FG21/1'],\n   evidence:[{text:'Signed client declaration, 21 Mar.',source:'Declaration',mark:'ok'},{text:'File note records the meeting but not what was explained.',source:'File note, 14 Mar',mark:'warn'}],\n   adviser:'Went through the drawdown risks in detail on the call, not written up.', adviserDate:'Recorded 14th March 2026'},\n  {n:9, ref:'CHK-09 · v2.0', title:'Replacement or switch justified', cls:'na', cats:[], conf:0, cov:0,\n   confReason:'', covItems:[],\n   summary:'No replacement or switch is present in this case, so the check does not apply.',\n   regRefs:['COBS 9A.3.2'], evidence:[], adviser:'', adviserDate:''},\n  {n:10, ref:'CHK-10 · v2.0', title:'Risks and disadvantages disclosed', cls:'clear', cats:[], conf:90, cov:100,\n   confReason:'Risks are itemised and specific to the recommendation.',\n   covItems:[{label:'Suitability report read',s:'ok'},{label:'KID read',s:'ok'}],\n   summary:'Sequencing risk, sustainability of withdrawals and loss of guarantees are each set out.',\n   regRefs:['COBS 9A.3'],\n   evidence:[{text:'Six risks itemised with client-specific framing.',source:'Suitability report (p.11)',mark:'ok'}],\n   adviser:'', adviserDate:''},\n  {n:11, ref:'CHK-C1 · v1.0', title:'Report includes a section for each stated goal', cls:'clear', cats:[], conf:95, cov:100,\n   confReason:'Deterministic structural check.',\n   covItems:[{label:'Suitability report read in full',s:'ok'}],\n   summary:'All three goals have a dedicated section in the report.',\n   regRefs:['Firm content check'],\n   evidence:[{text:'Sections 3.1, 3.2 and 3.3 map to the three recorded goals.',source:'Suitability report (p.4)',mark:'ok'}],\n   adviser:'', adviserDate:''},\n  {n:12, ref:'XDOC · v1.0', title:'Material facts consistent across the evidence set', cls:'concern', cats:['Data inconsistency','Data quality'], conf:62, cov:70,\n   confReason:'Two mismatches found; one may be a superseded version rather than a conflict.',\n   covItems:[{label:'Seven documents compared',s:'ok'},{label:'Research was password protected',s:'bad'}],\n   summary:'Two material facts differ between the report and the wider evidence set: capacity for loss, and the stated retirement date.',\n   regRefs:['REQ-CC-10'],\n   evidence:[{text:'Retirement date: 62 in the report, 63 in the cashflow model.',source:'Cashflow model (tab 1)',mark:'warn'},{text:'Capacity for loss: low in the fact find, medium in the report.',source:'Fact Find (p.4)',mark:'warn'}],\n   adviser:'', adviserDate:''}\n];\n\nconst STEPS = ['Ingesting documents','Analysing consistency','Checking compliance','Generating findings','Finalising assessment'];\nconst SUBMIT_STEPS = ['Recording your decisions','Applying the compliance grade','Writing the check record','Updating the advice case'];\nconst DISPS = ['Compliant','Non-compliant','Unable to assess','Remedial action required'];\nconst OVERRIDE_REASONS = ['Evidence supplied late','Not material to the outcome','Remediated in case','Other'];\n\nconst INK = 'rgb(1,18,34)', INK2 = 'rgb(52,65,78)', MUTED = 'rgb(78,90,101)';\nconst LINE = 'rgb(230,232,233)', STROKE = 'rgb(204,208,211)', SURFACE = 'rgb(250,250,250)';\nconst LINK = 'rgb(0,45,212)', BLUE = 'rgb(53,186,251)', FOCUS = 'rgb(154,221,253)';\nconst GREEN = 'rgb(135,210,102)', AMBER = 'rgb(255,175,83)', RED = 'rgb(245,51,63)';\nconst T_WARN = 'rgb(252,172,108)', T_OK = 'rgb(147,231,220)', T_GREY = 'rgb(204,208,211)';\nconst NM = \"font-family:'Neue Montreal',Inter,sans-serif\";\n\nconst TAG_BASE = 'display:inline-flex;align-self:flex-start;align-items:center;gap:4px;border-radius:4px;padding:4px 8px;' + NM\n  + ';font-weight:700;font-size:12px;line-height:16px;letter-spacing:.02em;white-space:nowrap;';\n\n// Figma overrides the label to a dark slate-teal on every tag except the\n// in-card \"Potential concern\" instance, which keeps its own fill hue.\nconst TAG_INK = 'rgb(58,92,88)';\n\nconst tagStyle = (hue, ink) => hue === T_GREY\n  // neutral chip is a flat surface with a hairline, not a tinted gradient\n  ? TAG_BASE + 'background:rgb(242,243,244);box-shadow:inset 0 0 0 .5px rgb(204,208,211);color:' + (ink || TAG_INK)\n  : TAG_BASE + 'box-shadow:inset 0 0 0 .5px rgba(0,0,0,0.1);'\n    + 'background:linear-gradient(rgba(255,255,255,0.8),rgba(255,255,255,0.8)),linear-gradient(' + hue + ',' + hue + ');'\n    + 'color:' + (ink || TAG_INK);\n\n// Figma buttons: Content padding 4px, Label padding 0 4px → 8px per side.\nconst BTN_BASE = 'height:30px;border:0;border-radius:4px;padding:4px 8px;font-weight:600;font-size:14px;line-height:22px;white-space:nowrap;'\n  + 'display:inline-flex;align-items:center;gap:6px;';\n\nconst DISP_ICON = {\n  'Compliant': 'shield-check',\n  'Non-compliant': 'shield-x',\n  'Unable to assess': 'shield-question',\n  'Remedial action required': 'shield-alert-line'\n};\n// lucide/shield-alert, filled — copied from the .fig. Colour tracks the level:\n// the file shows Medium in rgb(53,186,251) and Low in rgb(255,175,83).\nconst shieldHue = (v) => v >= 80 ? GREEN : v >= 60 ? BLUE : AMBER;\nconst shieldIcon = (v) => 'position:relative;width:24px;height:24px;display:block;flex:none;color:' + shieldHue(v);\n\nconst RES = (id, fallback) => (window.__resources && window.__resources[id]) || fallback;\nconst MASK_ID = {\n  'shield-check': 'shieldCheck', 'shield-x': 'shieldX',\n  'shield-question': 'shieldQuestion', 'shield-alert-line': 'shieldAlertLine'\n};\nconst maskIcon = (name, colour, px) => {\n  var u = RES(MASK_ID[name], 'io-assets/' + name + '.svg');\n  return 'width:' + px + 'px;height:' + px + 'px;flex:none;display:block;background:' + colour\n    + ';-webkit-mask:url(' + u + ') no-repeat center/contain'\n    + ';mask:url(' + u + ') no-repeat center/contain';\n};\nconst secondary = (on) => BTN_BASE + (on\n  ? 'background:' + INK + ';color:rgb(255,255,255);'\n  : 'background:rgb(255,255,255);box-shadow:inset 0 0 0 1px ' + STROKE + ';color:' + INK + ';');\nconst primary = (on) => BTN_BASE + (on\n  ? 'background:' + INK + ';color:rgb(255,255,255);'\n  : 'background:rgb(230,232,233);color:rgb(144,150,158);cursor:not-allowed;');\n\nconst railBtn = (active) => 'display:flex;align-items:center;gap:8px;width:100%;height:32px;border:0;border-radius:4px;padding:8px;font-size:14px;line-height:22px;color:' + INK + ';'\n  + (active ? 'background:' + LINE + ';font-weight:600;' : 'background:transparent;font-weight:400;');\n\nconst dot = (s) => 'width:12px;height:12px;border-radius:50%;flex:none;display:block;background:'\n  + (s === 'ok' ? GREEN : s === 'warn' ? AMBER : s === 'bad' ? RED : STROKE);\nconst smallDot = (s) => 'width:8px;height:8px;border-radius:50%;flex:none;display:block;background:'\n  + (s === 'ok' ? GREEN : s === 'warn' ? AMBER : s === 'bad' ? RED : STROKE);\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'analysing', step: 0, submitStep: 0, sel: 3,\n  => f.covItems.some(c => c.s === 'bad')).length}\n      ].map(t => {\n        const active = !!st.filter && st.filter.kind === t.kind;\n        return {\n          label: t.label, count: t.count, style: railBtn(active),\n          countStyle: 'font-size:14px;line-height:22px;color:' + (t.count ? INK : 'rgb(144,150,158)'),\n          onPick: () => this.setState(s => ({filter: active ? null : {kind:t.kind}}))\n        };\n      }),\n\n      tallyClear: FINDINGS.filter(f => f.cls === 'clear').length + ' no issue found',\n      tallyClearStyle: tagStyle(T_OK),\n      tallyConcern: FINDINGS.filter(f => f.cls === 'concern').length + ' potential issues',\n      tallyConcernStyle: tagStyle(T_WARN),\n      tallyNa: FINDINGS.filter(f => f.cls === 'na').length + ' not applicable',\n      tallyNaStyle: tagStyle(T_GREY),\n      coverageBar: 'height:100%;border-radius:999px;background:' + BLUE + ';width:77.8%',\n      coverageLabel: '7/9',\n      dispositionProgress: dispCount + ' of ' + dispTotal + ' dispositioned',\n\n      listHeading: st.filter ? list.length + ' of ' + FINDINGS.length + ' findings' : 'All ' + FINDINGS.length + ' findings',\n      openSubtitle: open.length + (open.length === 1 ? ' potential concern' : ' potential concerns'),\n      refSubtitle: (clearCount ? clearCount + ' checks came back clear and are marked compliant automatically — open one to override.' : '')\n        + (clearCount && naCount ? ' ' : '')\n        + (naCount ? naCount + ' check is not applicable to this case.' : ''),\n      openFindings: open.map(f => this.buildFinding(f)),\n      refFindings: ref.map(f => this.buildFinding(f)),\n\n      sel: {\n        version: sel.ref + ' · Ruleset v3.0 · Effective 21 Jul 2026',\n        title: sel.title,\n        regRefs: sel.regRefs.map(r => ({label: r})),\n        evidence: sel.evidence.map(e => ({\n          text: e.text, source: e.source, dotStyle: dot(e.mark), onOpen: () => {}\n        })),\n        hasAdviser: !!sel.adviser, adviser: sel.adviser, erriding: overriding,\n      overrideLabel: 'Overriding ' + this.gradeName(comp.k) + ' → ' + this.gradeName(finalK),\n      overrideReasons: OVERRIDE_REASONS.map(r => ({\n        label: r, style: secondary(st.overrideReason === r), onPick: () => this.setState({overrideReason: r})\n      })),\n      gradeComment: st.gradeComment,\n      onGradeComment: e => { const v = e.target.value; this.setState({gradeComment: v}); },\n\n      finaliseActions: [\n        {key:'store', label:'Store the outcome against the advice case record', note:'Immutable snapshot: findings, dispositions, grade, ruleset version, checker ID.', required:true},\n        {key:'notify', label:'Notify the adviser that the review is complete', note:'Sends your commentary with the outcome.', required:false}\n      ].map(a => {\n        const on = a.required || !!st.actions[a.key];\n        return {\n          label: a.label, note: a.note,\n          boxStyle: 'position:relative;width:24px;height:24px;flex:none;margin-top:2px;padding:0;border:0;background:none;display:block;color:'\n            + (on ? 'rgb(55,180,0)' : STROKE) + (a.required ? ';cursor:default' : ''),\n          iconStyle: 'position:absolute;left:2.002px;top:1.997px;width:20px;height:20px;display:block;'\n            + 'background:' + (on ? 'rgb(55,180,0)' : STROKE) + ';'\n            + '-webkit-mask:url(' + RES('circleCheck', 'io-assets/circle-check-big.svg') + ') no-repeat center/contain;'\n            + 'mask:url(' + RES('circleCheck', 'io-assets/circle-check-big.svg') + ') no-repeat center/contain',\n          onToggle: () => { if (!a.required) this.setState(s => ({actions: {...s.actions, [a.key]: !s.actions[a.key]}})); }\n        };\n      }),\n      shareToggle: () => this.setState(s => ({actions: {...s.actions, share: !s.actions.share}})),\n      shareRadioStyle: 'width:16.001px;height:16.001px;flex:none;border:0;border-radius:9999px;background:rgb(255,255,255);'\n        + 'box-shadow:inset 0 0 0 1px ' + (st.actions.share ? INK : STROKE) + ';'\n        + 'display:flex;align-items:center;justify-content:center;padding:0',\n      shareDotStyle: st.actions.share\n        ? 'width:8px;height:8px;border-radius:9999px;background:' + INK + ';display:block'\n        : 'width:0.001px;height:0.001px;background:rgb(255,255,255);display:block',\n      finaliseNote: canFinalise\n        ? 'Once finalised, the record cannot be edited.'\n        : (overriding && !st.overrideReason ? 'Give a reason for the grade override to continue.' : 'All findings need a decision first.'),\n      finaliseStyle: primary(canFinalise),\n      finalise: () => { if (canFinalise) this.submit(); },\n\n      hasNotes: notes.length > 0,\n      notesSubtitle: notes.length === 1\n        ? '1 note captured while working through the findings.'\n        : notes.length + ' notes captured while working through the findings.',\n      checkNotes: notes.map(n => ({\n        title: n.title, ref: n.ref, note: n.note,\n        tagLabel: n.disp,\n        tagStyle: tagStyle(n.disp === 'Compliant' ? T_OK : n.disp === 'Unable to assess' ? T_GREY : T_WARN)\n      })),\n\n      finalGrade: this.gradeName(finalK),\n      recordRows: [\n        {label:'Advice case', value:'Mr James Fraser · pension, new advice'},\n        {label:'Computed grading', value: this.gradeName(comp.k) + ' — ' + comp.rule.toLowerCase()},\n        {label:'Final grading', value: overriding\n          ? this.gradeName(finalK) + ' — overridden, reason: ' + (st.overrideReason || 'not given')\n          : this.gradeName(finalK) + ' — computed grading accepted'},\n        {label:'Dispositions', value: DISPS.map(d => FINDINGS.filter(f => this.eff(f) === d).length + ' ' + d.toLowerCase()).join(' · ')},\n        {label:'Checker commentary', value: st.gradeComment || 'None given'},\n        {label:'Evidence coverage', value:'7 of 9 categories available · 1 source unreadable'},\n        {label:'Ruleset', value:'v3.0, effective 21 Jul 2026 · 12 checks evaluated'}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
